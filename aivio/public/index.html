<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API 中转站 · 作业控制台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">API</div>
        <div>
          <h1>API 中转站</h1>
          <p id="serverStatus">连接中</p>
        </div>
      </div>

      <section class="panel">
        <div class="panel-title">
          <span>模型接入</span>
          <button class="icon-button" id="refreshProviders" title="刷新供应商">↻</button>
        </div>
        <label>
          <span>供应商</span>
          <select id="providerSelect"></select>
        </label>
        <input id="baseUrlInput" type="hidden">
        <label>
          <span>模型名</span>
          <input id="modelInput" list="modelList" autocomplete="off" spellcheck="false" placeholder="输入模型 ID">
          <datalist id="modelList"></datalist>
        </label>
        <label>
          <span>常用模型</span>
          <select id="modelPresetSelect"></select>
        </label>
        <div class="split-row">
          <label>
            <span>Temperature</span>
            <input id="temperatureInput" type="number" min="0" max="2" step="0.1" value="0.7">
          </label>
          <label>
            <span>Max tokens</span>
            <input id="maxTokensInput" type="number" min="1" max="200000" step="1" value="4096">
          </label>
        </div>
        <div class="button-row">
          <button id="saveSettings">保存</button>
          <button id="testCall" class="secondary">测试</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <span>中转接口</span>
          <button class="icon-button" id="copyEndpoint" title="复制接口地址">⧉</button>
        </div>
        <code id="relayEndpoint">http://localhost:8787/v1/chat/completions</code>
        <div class="panel-title" style="margin-top:12px">
          <span>后端模式</span>
        </div>
        <code id="apiMode">PowerShell API · /api</code>
        <div class="button-row" style="margin-top:10px">
          <button type="button" class="secondary" id="usePowerShellApi">PowerShell</button>
          <button type="button" class="secondary" id="useNodeApi">Node API</button>
        </div>
      </section>

      <section class="panel auth-panel">
        <div class="panel-title">
          <span>账号</span>
        </div>
        <p id="authStatus">未登录</p>
        <div class="balance-box" id="balanceBox" hidden>
          <div>
            <span>余额</span>
            <strong id="userBalance">0</strong>
          </div>
          <button type="button" class="secondary" id="refreshBalance">刷新余额</button>
          <small>充值功能下一阶段开放。</small>
        </div>
        <form id="loginForm" class="auth-form">
          <label>
            <span>邮箱</span>
            <input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com">
          </label>
          <label>
            <span>密码</span>
            <input id="loginPassword" type="password" autocomplete="current-password" placeholder="至少 6 位">
          </label>
          <button type="submit">登录</button>
        </form>
        <form id="registerForm" class="auth-form">
          <label>
            <span>注册邮箱</span>
            <input id="registerEmail" type="email" autocomplete="email" placeholder="you@example.com">
          </label>
          <label>
            <span>昵称</span>
            <input id="registerNickname" autocomplete="nickname" placeholder="可选">
          </label>
          <label>
            <span>注册密码</span>
            <input id="registerPassword" type="password" autocomplete="new-password" placeholder="至少 6 位">
          </label>
          <button type="submit" class="secondary">注册</button>
        </form>
        <button id="logoutButton" class="secondary" type="button" hidden>退出登录</button>
      </section>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <nav class="tabs" aria-label="工作区">
          <button class="tab active" data-tab="console">控制台</button>
          <button class="tab" data-tab="homework">作业</button>
          <button class="tab" data-tab="video">视频</button>
          <button class="tab" id="rechargeTab" data-tab="recharge" hidden>充值</button>
          <button class="tab" id="adminTab" data-tab="admin" hidden>管理后台</button>
          <button class="tab" data-tab="history">记录</button>
        </nav>
        <div class="top-actions">
          <span id="activeModel">未选择模型</span>
          <button id="clearAll" class="secondary">清空</button>
        </div>
      </header>

      <section class="view active" id="consoleView">
        <div class="chat-layout">
          <div class="chat-stream" id="chatStream"></div>
          <form class="composer" id="chatForm">
            <textarea id="chatInput" rows="4" placeholder="输入问题，直接调用当前模型"></textarea>
            <div class="composer-actions">
              <select id="systemPreset">
                <option value="">通用助手</option>
                <option value="你是严谨的学习助教，先给思路，再给答案。">学习助教</option>
                <option value="你是 API 调试专家，回答要给出可执行请求示例。">API 调试</option>
                <option value="karpathy-coding">Karpathy 编码</option>
                <option value="你是中文写作教练，输出清晰、自然、可交付。">写作教练</option>
              </select>
              <button type="submit">发送</button>
            </div>
          </form>
        </div>
      </section>

      <section class="view" id="homeworkView">
        <div class="homework-grid">
          <form class="assignment-form" id="assignmentForm">
            <div class="field-grid">
              <label>
                <span>作业标题</span>
                <input id="assignmentTitle" placeholder="例如：高数极限练习">
              </label>
              <label>
                <span>科目</span>
                <input id="assignmentSubject" placeholder="数学 / 英语 / 编程">
              </label>
            </div>
            <div class="mode-switch" role="tablist" aria-label="作业模式">
              <button type="button" class="mode active" data-mode="solve">解题</button>
              <button type="button" class="mode" data-mode="check">检查</button>
              <button type="button" class="mode" data-mode="outline">提纲</button>
              <button type="button" class="mode" data-mode="polish">润色</button>
            </div>
            <label>
              <span>题目或任务</span>
              <textarea id="assignmentPrompt" rows="8" placeholder="粘贴题目、材料或作业要求"></textarea>
            </label>
            <label>
              <span>评分要求</span>
              <textarea id="assignmentRubric" rows="4" placeholder="格式、字数、步骤、引用要求"></textarea>
            </label>
            <label>
              <span>补充材料</span>
              <textarea id="assignmentContext" rows="4" placeholder="课堂笔记、已完成草稿、老师提示"></textarea>
            </label>
            <div class="button-row">
              <button type="submit">生成作业</button>
              <button type="button" class="secondary" id="saveDraft">保存草稿</button>
            </div>
          </form>

          <article class="answer-panel">
            <div class="panel-title">
              <span>输出</span>
              <div class="mini-actions">
                <button class="icon-button" id="copyAnswer" title="复制输出">⧉</button>
                <button class="icon-button" id="downloadAnswer" title="导出 Markdown">⇩</button>
              </div>
            </div>
            <div class="answer-output" id="assignmentOutput"></div>
            <form class="followup-form" id="followupForm">
              <input id="followupInput" placeholder="继续追问或要求改写">
              <button type="submit">继续</button>
            </form>
          </article>
        </div>
      </section>

      <section class="view" id="videoView">
        <div class="video-grid">
          <form class="video-form" id="videoForm">
            <div class="field-grid">
              <select id="videoProviderSelect" hidden></select>
              <label>
                <span>模式</span>
                <select id="videoModeSelect">
                  <option value="text-to-video">文生视频</option>
                  <option value="image-to-video">图生视频</option>
                  <option value="first-last-frame">首尾帧视频</option>
                  <option value="reference-image">参考图视频</option>
                </select>
              </label>
            </div>
            <input id="videoBaseUrlInput" type="hidden" value="https://ark.cn-beijing.volces.com/api/v3">
            
            <label>
              <span>模型名</span>
              <input id="videoModelInput" list="videoModelList" autocomplete="off" spellcheck="false" placeholder="输入模型 ID">
              <datalist id="videoModelList"></datalist>
            </label>
            <label>
              <span>常用视频模型</span>
              <select id="videoModelPresetSelect"></select>
            </label>
            <p class="cost-hint" id="videoCostHint">预计消耗积分：--</p>
            <div class="field-grid compact">
              <label>
                <span>画幅</span>
                <select id="videoRatioInput">
                  <option value="16:9">16:9</option>
                  <option value="9:16">9:16</option>
                  <option value="1:1">1:1</option>
                  <option value="4:3">4:3</option>
                  <option value="3:4">3:4</option>
                  <option value="21:9">21:9</option>
                </select>
              </label>
              <label>
                <span>时长</span>
                <input id="videoDurationInput" type="number" min="1" max="60" step="1" value="5">
              </label>
              <label>
                <span>清晰度</span>
                <input id="videoResolutionInput" placeholder="720p / 1080p / 480p">
              </label>
              <label>
                <span>Seed</span>
                <input id="videoSeedInput" type="number" placeholder="可选">
              </label>
            </div>
            <div class="field-grid">
              <label class="check-row">
                <input id="videoGenerateAudioInput" type="checkbox">
                <span>生成音频</span>
              </label>
              <label class="check-row">
                <input id="videoWatermarkInput" type="checkbox">
                <span>添加水印</span>
              </label>
            </div>
            <label>
              <span>Prompt</span>
              <textarea id="videoPromptInput" rows="5" placeholder="描述镜头、主体、动作、风格、运镜、光线"></textarea>
            </label>
            <div class="field-grid">
              <label>
                <span>首帧/参考图 URL</span>
                <input id="videoImageUrlInput" autocomplete="off" spellcheck="false" placeholder="https://...">
              </label>
              <label>
                <span>尾帧 URL</span>
                <input id="videoEndImageUrlInput" autocomplete="off" spellcheck="false" placeholder="https://...">
              </label>
            </div>
            <div class="button-row">
              <button type="submit">提交视频任务</button>
              <button type="button" class="secondary" id="saveVideoSettings">保存视频配置</button>
            </div>
          </form>

          <article class="answer-panel">
            <div class="panel-title">
              <span>视频任务</span>
              <div class="mini-actions">
                <button class="icon-button" id="copyVideoResult" title="复制结果">⧉</button>
                <button class="icon-button" id="refreshVideoTask" title="查询任务">↻</button>
              </div>
            </div>
            <div class="task-strip">
              <label>
                <span>任务 ID / 查询 URL</span>
                <input id="videoTaskIdInput" autocomplete="off" spellcheck="false" placeholder="提交后自动填入">
              </label>
            </div>
            <div class="answer-output" id="videoOutput"></div>
          </article>
        </div>
      </section>

      <section class="view" id="rechargeView">
        <div class="recharge-layout">
          <article class="answer-panel recharge-panel">
            <div class="panel-title">
              <span>充值中心</span>
              <button id="refreshRecharge" class="secondary" type="button">刷新</button>
            </div>
            <p class="mock-pay-note">当前为 Mock 支付，仅用于本地开发测试。</p>
            <div class="package-grid" id="rechargePackages"></div>
          </article>

          <article class="answer-panel recharge-panel">
            <div class="panel-title">
              <span>我的订单</span>
            </div>
            <div class="order-list" id="orderList"></div>
          </article>
        </div>
      </section>

      <section class="view" id="adminView">
        <div class="admin-layout">
          <section class="admin-section">
            <div class="panel-title">
              <span>数据总览</span>
              <button id="refreshAdmin" class="secondary" type="button">刷新后台</button>
            </div>
            <div class="stats-grid" id="adminStats"></div>
          </section>

          <section class="admin-section">
            <div class="panel-title">
              <span>用户管理</span>
            </div>
            <div class="admin-table" id="adminUsers"></div>
            <div class="admin-detail" id="adminUserDetail"></div>
          </section>

          <section class="admin-section">
            <div class="panel-title">
              <span>订单管理</span>
            </div>
            <div class="admin-table" id="adminOrders"></div>
          </section>

          <section class="admin-section">
            <div class="panel-title">
              <span>任务管理</span>
            </div>
            <div class="admin-table" id="adminTasks"></div>
          </section>

          <section class="admin-section">
            <div class="panel-title">
              <span>积分流水</span>
            </div>
            <div class="admin-table" id="adminCreditLogs"></div>
          </section>

          <section class="admin-section">
            <div class="panel-title">
              <span>管理员日志</span>
            </div>
            <div class="admin-table" id="adminLogs"></div>
          </section>

          <section class="admin-section">
            <div class="panel-title">
              <span>模型管理</span>
            </div>
            <div class="admin-table" id="adminModels"></div>
          </section>

          <section class="admin-section">
            <div class="panel-title">
              <span>供应商管理</span>
            </div>
            <div class="admin-table" id="adminProviders"></div>
          </section>
        </div>
      </section>

      <section class="view" id="historyView">
        <div class="history-toolbar">
          <h2>我的任务</h2>
          <button id="refreshTasks" class="secondary">刷新任务</button>
          <button id="exportHistory" class="secondary">导出 JSON</button>
        </div>
        <div class="history-list" id="historyList"></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
